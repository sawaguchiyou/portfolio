      const easeInOut=t=>t<.5?2*t*t:-1+(4-2*t)*t;
      const easeOut=t=>1-Math.pow(1-t,3);
      const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const hexToRgb=(hex)=>{
        const n=parseInt(hex.replace('#',''),16);
        return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
      };
      const rgbToHex=(r,g,b)=>`#${[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}`;
      const mixHex=(a,b,t)=>{
        const ca=hexToRgb(a),cb=hexToRgb(b);
        return rgbToHex(lerp(ca.r,cb.r,t),lerp(ca.g,cb.g,t),lerp(ca.b,cb.b,t));
      };
      const getMoonFromClock=(now)=>{
        const hour=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
        const nightStart=18.5;
        const nightEnd=5;
        const nightLen=(24-nightStart)+nightEnd;
        const progress=hour>=nightStart
          ?(hour-nightStart)/nightLen
          :(hour+24-nightStart)/nightLen;
        const p=clamp(progress,0,1);
        const arc=Math.sin(Math.PI*p);
        return {p,x:90+500*p,y:166-86*arc};
      };
      const getSunFromClock=(now)=>{
        const hour=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
        const dayStart=5;
        const dayEnd=19;
        const p=clamp((hour-dayStart)/(dayEnd-dayStart),0,1);
        const altitude=Math.sin(Math.PI*p);
        const isDay=(hour>=dayStart&&hour<dayEnd);
        return {p,x:120+440*p,y:252-186*altitude,altitude,isDay};
      };

      function getSkyState(now,sunrise,sunset){
        const dawnTop='#223a63', dawnBottom='#d48767';
        const dayTop='#7eb9ef', dayBottom='#f2cc8d';
        const duskTop='#1f365f', duskBottom='#e17a56';
        const nightTop='#041326', nightBottom='#0a223a';
        if(!sunrise||!sunset||isNaN(sunrise)||isNaN(sunset)){
          const pseudoSunrise=new Date(now);
          pseudoSunrise.setHours(6,0,0,0);
          const pseudoSunset=new Date(now);
          pseudoSunset.setHours(18,0,0,0);
          const psr=pseudoSunrise.getTime();
          const pss=pseudoSunset.getTime();
          const pDayLen=pss-psr;
          const pTwi=Math.max(40*60*1000,pDayLen*0.14);
          const t=now.getTime();
          const pNightStart=t<psr?(pss-24*60*60*1000):pss;
          const pNightEnd=t<psr?psr:(psr+24*60*60*1000);
          const pNightLen=Math.max(1,pNightEnd-pNightStart);
          const pNightP=clamp((t-pNightStart)/pNightLen,0,1);
          const pMoon=getMoonFromClock(now);
          const sun=getSunFromClock(now);
          if(sun.isDay){
            const p=sun.p;
            const top=p<.5?mixHex(dawnTop,dayTop,p*2):mixHex(dayTop,duskTop,(p-.5)*2);
            const bottom=p<.5?mixHex(dawnBottom,dayBottom,p*2):mixHex(dayBottom,duskBottom,(p-.5)*2);
            const mid=mixHex(top,bottom,0.46);
            return {
              isNight:false,top,mid,bottom,
              sunX:sun.x,sunY:sun.y,
              sunOpacity:0.52+0.2*sun.altitude,haloOpacity:0.26+0.24*sun.altitude,
              isMorning:p<0.23,isEvening:p>0.74,isDeepNight:false
            };
          }
          const beforeDawn=t<psr;
          const baseNight={
            isNight:true,
            top:nightTop,
            mid:mixHex(nightTop,nightBottom,.45),
            bottom:nightBottom,
            moonX:pMoon.x,
            moonY:pMoon.y,
            moonOpacity:.85,
            starOpacity:.8,
            isMorning:false,
            isEvening:false,
            isDeepNight:(pMoon.p>0.16&&pMoon.p<0.42)
          };
          if(beforeDawn&&t>=psr-pTwi){
            const p=(t-(psr-pTwi))/pTwi;
            return {
              ...baseNight,
              top:mixHex(nightTop,dawnTop,p),
              mid:mixHex(mixHex(nightTop,nightBottom,.45),mixHex(dawnTop,dawnBottom,.45),p),
              bottom:mixHex(nightBottom,dawnBottom,p),
              moonOpacity:0.85*(1-p),
              starOpacity:0.8*(1-p)
            };
          }
          if(!beforeDawn&&t<=pss+pTwi){
            const p=(t-pss)/pTwi;
            return {
              ...baseNight,
              top:mixHex(duskTop,nightTop,p),
              mid:mixHex(mixHex(duskTop,duskBottom,.45),mixHex(nightTop,nightBottom,.45),p),
              bottom:mixHex(duskBottom,nightBottom,p),
              moonOpacity:0.85*p,
              starOpacity:0.8*p
            };
          }
          return baseNight;
        }
        const dayLen=sunset-sunrise;
        const twi=Math.max(40*60*1000,dayLen*0.14);
        const t=now.getTime();
        const nightStart=t<sunrise?(sunset-24*60*60*1000):sunset;
        const nightEnd=t<sunrise?sunrise:(sunrise+24*60*60*1000);
        const nightLen=Math.max(1,nightEnd-nightStart);
        const nightP=clamp((t-nightStart)/nightLen,0,1);
        const moon=getMoonFromClock(now);
        const sun=getSunFromClock(now);
        if(sun.isDay){
          const p=sun.p;
          const top = p<.5?mixHex(dawnTop,dayTop,p*2):mixHex(dayTop,duskTop,(p-.5)*2);
          const bottom = p<.5?mixHex(dawnBottom,dayBottom,p*2):mixHex(dayBottom,duskBottom,(p-.5)*2);
          const mid = mixHex(top,bottom,0.46);
          return {
            isNight:false, top, mid, bottom,
            sunX:sun.x, sunY:sun.y,
            sunOpacity:0.52+0.2*sun.altitude, haloOpacity:0.26+0.24*sun.altitude,
            isMorning:p<0.23, isEvening:p>0.74, isDeepNight:false
          };
        }
        const beforeDawn=t<sunrise;
        const baseNight={
          isNight:true,
          top:nightTop,
          mid:mixHex(nightTop,nightBottom,.45),
          bottom:nightBottom,
          moonX:moon.x,
          moonY:moon.y,
          moonOpacity:.85,
          starOpacity:.8,
          isMorning:false,
          isEvening:false,
          isDeepNight:(moon.p>0.16&&moon.p<0.42)
        };
        if(beforeDawn&&t>=sunrise-twi){
          const p=(t-(sunrise-twi))/twi;
          return {
            ...baseNight,
            top:mixHex(nightTop,dawnTop,p),
            mid:mixHex(mixHex(nightTop,nightBottom,.45),mixHex(dawnTop,dawnBottom,.45),p),
            bottom:mixHex(nightBottom,dawnBottom,p),
            moonOpacity:0.85*(1-p),
            starOpacity:0.8*(1-p)
          };
        }
        if(!beforeDawn&&t<=sunset+twi){
          const p=(t-sunset)/twi;
          return {
            ...baseNight,
            top:mixHex(duskTop,nightTop,p),
            mid:mixHex(mixHex(duskTop,duskBottom,.45),mixHex(nightTop,nightBottom,.45),p),
            bottom:mixHex(duskBottom,nightBottom,p),
            moonOpacity:0.85*p,
            starOpacity:0.8*p
          };
        }
        return baseNight;
      }

function Bird({bird,t}){
  if(!bird||!bird.active) return null;
  const p=Math.min(Math.max((t-bird.startTime)/bird.duration,0),1);
  const x=bird.startX+(bird.endX-bird.startX)*p;
  const wing=Math.sin(t*7+bird.seed)*4;
  const flip=bird.dir==='left'?-1:1;
  return h('g',{style:{transform:`translate(${x}px,${bird.y}px) scale(${flip*bird.scale},${bird.scale})`},opacity:0.9},
    h('path',{d:`M-14,0 Q-6,${-8-wing} 2,0`,fill:'none',stroke:'rgba(20,40,60,.68)',strokeWidth:2,strokeLinecap:'round'}),
    h('path',{d:`M2,0 Q10,${-8-wing} 18,0`,fill:'none',stroke:'rgba(20,40,60,.68)',strokeWidth:2,strokeLinecap:'round'})
  );
}

      function App(){
        const raf=useRef(null);
        const t0=useRef(null);
        const [time,setTime]=useState(0);
        const [phase,setPhase]=useState(startUnderwater?'underwater':'surface');  // surface|casting|diving|underwater
        const [rodOut,setRodOut]=useState(false);
        const [lineY,setLineY]=useState(0);
        const [vb,setVb]=useState({x:0,y:0,w:W,h:H});
        const [fishVisible,setFishVisible]=useState(false);
        const [hookY,setHookY]=useState(startUnderwater?25:30);
        const [toast,setToast]=useState(null);
        const [caughtFish,setCaughtFish]=useState(null);
        const [isReeling,setIsReeling]=useState(false);
        const [returnFade,setReturnFade]=useState(0);
        const [pageFade,setPageFade]=useState(0);
        const [isNavigating,setIsNavigating]=useState(false);
        const [birds,setBirds]=useState([]);
        const [sunInfo,setSunInfo]=useState({sunrise:null,sunset:null});
        const [nowDate,setNowDate]=useState(new Date());
        const [audioReady,setAudioReady]=useState(false);
        const [isMuted,setIsMuted]=useState(false);
        const [uiVisible,setUiVisible]=useState(true);
        const skyState=getSkyState(nowDate,sunInfo.sunrise,sunInfo.sunset);
        const reelRaf=useRef(null);
        const birdSpawnTimeout=useRef(null);
        const birdFinishTimeout=useRef(null);
        const surfaceAudioRef=useRef(null);
        const underwaterAudioRef=useRef(null);
        const castAudioRef=useRef(null);
        const audioFadeRafRef=useRef(null);
        const bgmBaseVolumeRef=useRef(0.42);
        const uiHideTimerRef=useRef(null);

        useEffect(()=>{
          const surfaceAudio=new Audio('assets/bgm/waves.mp3');
          const underwaterAudio=new Audio('assets/bgm/underwater.mp3');
          const castAudio=new Audio('assets/bgm/cast.mp3');
          surfaceAudio.loop=true;
          underwaterAudio.loop=true;
          surfaceAudio.preload='auto';
          underwaterAudio.preload='auto';
          castAudio.preload='auto';
          surfaceAudio.volume=0;
          underwaterAudio.volume=0;
          castAudio.volume=0.20;
          surfaceAudioRef.current=surfaceAudio;
          underwaterAudioRef.current=underwaterAudio;
          castAudioRef.current=castAudio;
          return()=>{
            if(audioFadeRafRef.current) cancelAnimationFrame(audioFadeRafRef.current);
            surfaceAudio.pause();
            underwaterAudio.pause();
            castAudio.pause();
            surfaceAudio.src='';
            underwaterAudio.src='';
            castAudio.src='';
          };
        },[]);

        useEffect(()=>{
          const unlockAudio=()=>{
            const surfaceAudio=surfaceAudioRef.current;
            const underwaterAudio=underwaterAudioRef.current;
            if(!surfaceAudio||!underwaterAudio||audioReady) return;
            Promise.allSettled([surfaceAudio.play(),underwaterAudio.play()]).then(()=>{
              setAudioReady(true);
            });
          };
          window.addEventListener('pointerdown',unlockAudio,{once:true});
          window.addEventListener('keydown',unlockAudio,{once:true});
          return()=>{
            window.removeEventListener('pointerdown',unlockAudio);
            window.removeEventListener('keydown',unlockAudio);
          };
        },[audioReady]);

        useEffect(()=>{
          if(!audioReady) return;
          const surfaceAudio=surfaceAudioRef.current;
          const underwaterAudio=underwaterAudioRef.current;
          if(!surfaceAudio||!underwaterAudio) return;
          if(audioFadeRafRef.current) cancelAnimationFrame(audioFadeRafRef.current);
          const targetTrack=phase==='underwater'?'underwater':'surface';
          const targetVol=isMuted?0:bgmBaseVolumeRef.current;
          const startSurface=surfaceAudio.volume;
          const startUnderwater=underwaterAudio.volume;
          const endSurface=targetTrack==='surface'?targetVol:0;
          const endUnderwater=targetTrack==='underwater'?targetVol:0;
          if(surfaceAudio.paused) surfaceAudio.play().catch(()=>{});
          if(underwaterAudio.paused) underwaterAudio.play().catch(()=>{});
          const dur=1000;
          let tStart=null;
          const step=(ts)=>{
            if(!tStart) tStart=ts;
            const p=Math.min((ts-tStart)/dur,1);
            const ep=easeInOut(p);
            surfaceAudio.volume=startSurface+(endSurface-startSurface)*ep;
            underwaterAudio.volume=startUnderwater+(endUnderwater-startUnderwater)*ep;
            if(p<1){
              audioFadeRafRef.current=requestAnimationFrame(step);
            }
          };
          audioFadeRafRef.current=requestAnimationFrame(step);
        },[phase,isMuted,audioReady]);

        useEffect(()=>{
          const resetUiTimer=()=>{
            if(uiHideTimerRef.current) clearTimeout(uiHideTimerRef.current);
            setUiVisible(true);
            uiHideTimerRef.current=setTimeout(()=>setUiVisible(false),5000);
          };
          resetUiTimer();
          const events=['mousemove','mousedown','touchstart','keydown'];
          events.forEach((evt)=>window.addEventListener(evt,resetUiTimer,{passive:true}));
          return()=>{
            if(uiHideTimerRef.current) clearTimeout(uiHideTimerRef.current);
            events.forEach((evt)=>window.removeEventListener(evt,resetUiTimer));
          };
        },[]);

        useEffect(()=>{
          const loop=ts=>{
            if(!t0.current)t0.current=ts;
            setTime((ts-t0.current)/1000);
            raf.current=requestAnimationFrame(loop);
          };
          raf.current=requestAnimationFrame(loop);
          return()=>cancelAnimationFrame(raf.current);
        },[]);

        useEffect(()=>{
          let cancelled=false;
          const fallback={lat:35.681236,lng:139.767125};
          const fetchSun=async(lat,lng)=>{
            try{
              const res=await fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`);
              const data=await res.json();
              if(!data||!data.results) return;
              const sunrise=new Date(data.results.sunrise).getTime();
              const sunset=new Date(data.results.sunset).getTime();
              if(!cancelled) setSunInfo({sunrise,sunset});
            }catch(_e){}
          };
          // まずフォールバック地点で即時取得して、初期描画の空状態を安定させる
          fetchSun(fallback.lat,fallback.lng);
          if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
              p=>fetchSun(p.coords.latitude,p.coords.longitude),
              ()=>{},
              {enableHighAccuracy:false,timeout:7000,maximumAge:3600000}
            );
          }
          const timer=setInterval(()=>setNowDate(new Date()),30000);
          return()=>{cancelled=true;clearInterval(timer);};
        },[]);

        useEffect(()=>{
          const clearBirdTimers=()=>{
            if(birdSpawnTimeout.current){ clearTimeout(birdSpawnTimeout.current); birdSpawnTimeout.current=null; }
            if(birdFinishTimeout.current){ clearTimeout(birdFinishTimeout.current); birdFinishTimeout.current=null; }
          };
          if(phase!=='surface'){
            clearBirdTimers();
            setBirds([]);
            return clearBirdTimers;
          }

          const scheduleBird=()=>{
            const eveningBoost=!!skyState.isEvening;
            const waitMs=eveningBoost?(2800+Math.random()*2200):(5000+Math.random()*5000);
            birdSpawnTimeout.current=setTimeout(()=>{
              const startTime=(performance.now()-(t0.current||0))/1000;
              const count=eveningBoost?(Math.random()<0.72?2:3):(Math.random()<0.4?2:1);
              const makeBird=(idx)=> {
                const dir=Math.random()<0.5?'right':'left';
                const baseY=34+Math.random()*55;
                const y=baseY+(idx===1?(Math.random()<0.5?-10:10):0);
                const duration=7.5+Math.random()*3;
                const startX=dir==='right'?-50:730;
                const endX=dir==='right'?730:-50;
                const scale=0.55+Math.random()*0.45; // 最大サイズは現状(1.0)
                return {id:`bird-${Date.now()}-${idx}`,active:true,startTime,duration,dir,startX,endX,y,seed:Math.random()*10,scale};
              };
              const nextBirds=Array.from({length:count},(_,i)=>makeBird(i));
              setBirds(nextBirds);
              const maxDuration=Math.max(...nextBirds.map(b=>b.duration));
              birdFinishTimeout.current=setTimeout(()=>{
                setBirds([]);
                scheduleBird();
              },maxDuration*1000+180);
            },waitMs);
          };
          scheduleBird();
          return clearBirdTimers;
        },[phase,skyState.isEvening]);

        useEffect(()=>{
          if(!startUnderwater) return;
          setFishVisible(false);
          setHookY(25);
          let s2=null;
          const hDur=1400;
          const hTgt=115;
          const hs=ts2=>{
            if(!s2)s2=ts2;
            const hp=Math.min((ts2-s2)/hDur,1);
            setHookY(25+easeOut(hp)*(hTgt-25));
            if(hp<1)requestAnimationFrame(hs);
            else setTimeout(()=>setFishVisible(true),350);
          };
          requestAnimationFrame(hs);
        },[]);

        const handleClick=useCallback(()=>{
          if(phase!=='surface')return;
          if(!isMuted){
            const castAudio=castAudioRef.current;
            if(castAudio){
              castAudio.currentTime=0;
              castAudio.play().catch(()=>{});
            }
          }
          if(!audioReady){
            const surfaceAudio=surfaceAudioRef.current;
            const underwaterAudio=underwaterAudioRef.current;
            Promise.allSettled([
              surfaceAudio?surfaceAudio.play():Promise.resolve(),
              underwaterAudio?underwaterAudio.play():Promise.resolve()
            ]).then(()=>setAudioReady(true));
          }
          setPhase('casting');
          setRodOut(true);
          let s=null;
          const castDur=1800,lineDur=2200,lineMax=172;
          const step=ts=>{
            if(!s)s=ts;
            const lp=Math.min((ts-s)/lineDur,1);
            setLineY(easeOut(lp)*lineMax);
            if(lp<1){requestAnimationFrame(step);}
            else{setTimeout(dive,500);}
          };
          requestAnimationFrame(step);
        },[phase,audioReady,isMuted]);

        const dive=()=>{
          setPhase('diving');
          const sv={x:0,y:0,w:W,h:H};
          const ev={x:0,y:218,w:W*.88,h:H*.88};
          const dur=2600;let s=null;
          const step=ts=>{
            if(!s)s=ts;
            const p=Math.min((ts-s)/dur,1),ep=easeInOut(p);
            setVb({x:sv.x+(ev.x-sv.x)*ep,y:sv.y+(ev.y-sv.y)*ep,w:sv.w+(ev.w-sv.w)*ep,h:sv.h+(ev.h-sv.h)*ep});
            if(p<1){requestAnimationFrame(step);}
            else{
              setTimeout(()=>{
                setPhase('underwater');
                // 海中シーン表示時は viewBox を通常に戻して、下部の不要な紺色余白を防ぐ
                setVb({x:0,y:0,w:W,h:H});
                setHookY(25);
                let s2=null;const hDur=1600,hTgt=115;
                const hs=ts2=>{
                  if(!s2)s2=ts2;
                  const hp=Math.min((ts2-s2)/hDur,1);
                  setHookY(25+easeOut(hp)*(hTgt-25));
                  if(hp<1)requestAnimationFrame(hs);
                  else setTimeout(()=>setFishVisible(true),450);
                };
                requestAnimationFrame(hs);
              },180);
            }
          };
          requestAnimationFrame(step);
        };

        const navigateToLabel=(label)=>{
          if(isNavigating) return;
          setIsNavigating(true);
          const path=DESTINATIONS[label]||'index.html';
          const targetUrl=`${window.location.origin}${window.location.pathname.replace(/\/[^/]*$/,'/')}${path}`;
          setPageFade(1);
          setTimeout(()=>{
            try{
              window.top.location.href=targetUrl;
            }catch(_e){
              window.location.href=targetUrl;
            }
          },420);
        };

        const handleFish=(d,fishX,fishY)=>{
          if(isReeling||caughtFish||!fishVisible) return;
          setIsReeling(true);
          setToast(`${d.label} を釣り上げ中...`);
          const startX=fishX;
          const startY=fishY;
          const startHookY=hookY;
          const mouthOffset=getMouthOffset(d);
          const biteDur=700;
          const biteStart=performance.now();

          const biteStep=(ts)=>{
            const p=Math.min((ts-biteStart)/biteDur,1);
            const ep=easeOut(p);
            setCaughtFish({
              ...d,
              x:startX+((HOOK_X+HOOK_TIP_DX-mouthOffset.x)-startX)*ep,
              y:startY+((startHookY+HOOK_TIP_DY-mouthOffset.y)-startY)*ep
            });
            if(p<1){
              reelRaf.current=requestAnimationFrame(biteStep);
            }else{
              const reelFromY=startHookY;
              const reelToY=-60;
              const reelDur=1200;
              const reelStart=performance.now();
              const reelStep=(ts2)=>{
                const rp=Math.min((ts2-reelStart)/reelDur,1);
                const erp=easeInOut(rp);
                const newHookY=reelFromY+(reelToY-reelFromY)*erp;
                setHookY(newHookY);
                setCaughtFish(prev=>prev?{...prev,x:HOOK_X+HOOK_TIP_DX-mouthOffset.x,y:newHookY+HOOK_TIP_DY-mouthOffset.y}:prev);
                if(rp<1){
                  reelRaf.current=requestAnimationFrame(reelStep);
                }else{
                  setTimeout(()=>navigateToLabel(d.label),220);
                }
              };
              reelRaf.current=requestAnimationFrame(reelStep);
            }
          };
          reelRaf.current=requestAnimationFrame(biteStep);
        };

  const handleRecast=()=>{
    if(phase!=='underwater'||isReeling) return;
    setIsReeling(true);
    setToast(null);
    const fromY=hookY;
    const toY=-60;
    const reelDur=900;
    let startTs=null;
    const reelOnly=(ts)=>{
      if(!startTs) startTs=ts;
      const p=Math.min((ts-startTs)/reelDur,1);
      const ep=easeInOut(p);
      setHookY(fromY+(toY-fromY)*ep);
      if(p<1){
        reelRaf.current=requestAnimationFrame(reelOnly);
      }else{
        setCaughtFish(null);
        setFishVisible(false);
        setPhase('returning');
        setReturnFade(0);
        let fadeStart=null;
        const fadeDur=650;
        const fadeStep=(ts2)=>{
          if(!fadeStart) fadeStart=ts2;
          const fp=Math.min((ts2-fadeStart)/fadeDur,1);
          setReturnFade(fp);
          if(fp<1){
            reelRaf.current=requestAnimationFrame(fadeStep);
          }else{
            setPhase('surface');
            setRodOut(false);
            setLineY(0);
            setHookY(30);
            setVb({x:0,y:0,w:W,h:H});
            setIsReeling(false);
            setReturnFade(0);
          }
        };
        reelRaf.current=requestAnimationFrame(fadeStep);
      }
    };
    reelRaf.current=requestAnimationFrame(reelOnly);
  };

        useEffect(()=>{
          return()=>{
            if(reelRaf.current) cancelAnimationFrame(reelRaf.current);
            if(birdSpawnTimeout.current) clearTimeout(birdSpawnTimeout.current);
            if(birdFinishTimeout.current) clearTimeout(birdFinishTimeout.current);
          };
        },[]);

  const isUW=phase==='underwater';
  const isReturning=phase==='returning';
        const vbStr=`${vb.x} ${vb.y} ${vb.w} ${vb.h}`;

        return h('div',{style:{width:'100%',height:'100%',background:'#071e38',overflow:'hidden',position:'relative'}},
          h('svg',{width:'100%',height:'100%',preserveAspectRatio:'xMidYMid slice',viewBox:vbStr,xmlns:'http://www.w3.org/2000/svg',style:{display:'block'}},
      h('defs',null,
        h('clipPath',{id:'aboveDeck'},h('rect',{x:255,y:0,width:190,height:304})),
        h('linearGradient',{id:'sunsetSkyGradient',x1:'0%',y1:'0%',x2:'0%',y2:'100%'},
          h('stop',{offset:'0%','stop-color':skyState.top}),
          h('stop',{offset:'56%','stop-color':skyState.mid}),

          h('stop',{offset:'55%','stop-color':'#f0d4a0','stop-opacity':String((skyState.haloOpacity||0)*0.46)}),
          h('stop',{offset:'100%','stop-color':'#f0d4a0','stop-opacity':'0'})
        ),
        h('radialGradient',{id:'moonHaloGradient',gradientUnits:'userSpaceOnUse',cx:String(skyState.moonX??520),cy:String(skyState.moonY??110),r:'30'},
          h('stop',{offset:'0%','stop-color':'#ffe7a3','stop-opacity':'0.30'}),
          h('stop',{offset:'46%','stop-color':'#f7cf80','stop-opacity':'0.12'}),
          h('stop',{offset:'78%','stop-color':'#f6c86e','stop-opacity':'0.04'}),
          h('stop',{offset:'100%','stop-color':'#f6c86e','stop-opacity':'0'})
        ),
        h('linearGradient',{id:'startButtonGlass',x1:'0%',y1:'0%',x2:'0%',y2:'100%'},

          h('stop',{offset:'45%','stop-color':'rgba(210,232,248,0.08)'}),
          h('stop',{offset:'100%','stop-color':'rgba(130,170,200,0.045)'})
        ),
        h('radialGradient',{id:'startButtonGloss',cx:'50%',cy:'50%',r:'50%'},
          h('stop',{offset:'0%','stop-color':'rgba(255,255,255,0.34)'}),
          h('stop',{offset:'100%','stop-color':'rgba(255,255,255,0)'})
        )
      ),
      isUW
        ?h(Underwater,{t:time,fishVisible,onFish:handleFish,hookY,caughtFish,isReeling})
        :isReturning
          ?h('g',null,
              h(Surface,{t:time,onClickHere:handleClick,showBtn:false,rodOut:false,lineY:0,birds,skyState,uiVisible}),
              h('g',{style:{opacity:1-returnFade}},
                h(Underwater,{t:time,fishVisible,onFish:handleFish,hookY,caughtFish,isReeling})
              )
            )
          :h(Surface,{t:time,onClickHere:handleClick,showBtn:phase==='surface',rodOut,lineY,birds,skyState,uiVisible})
          ),
    isUW&&fishVisible&&!isReeling&&h('button',{
      onClick:handleRecast,
      style:{
        position:'absolute',top:'12px',left:'12px',zIndex:20,cursor:'pointer',
        background:'rgba(6,20,40,.72)',color:'#dbeafe',
        border:'1px solid rgba(120,210,255,.45)',borderRadius:'999px',
        padding:'8px 14px',fontSize:'12px',fontWeight:700,letterSpacing:'.03em'
      }
    },'もう一度キャストする'),
          h('button',{
            onClick:()=>setIsMuted(v=>!v),
            title:isMuted?'サウンドON':'サウンドOFF',
            'aria-label':isMuted?'サウンドON':'サウンドOFF',
            style:{
              position:'absolute',top:'12px',right:'12px',zIndex:25,cursor:'pointer',
              background:'rgba(6,20,40,.16)',color:'rgba(219,234,254,.88)',
              border:'1px solid rgba(120,210,255,.16)',borderRadius:'999px',
              padding:'6px 8px',lineHeight:1,
              opacity:uiVisible?1:0,transition:'opacity .45s ease',pointerEvents:uiVisible?'auto':'none'
            }
          },
            h('img',{
              src:isMuted?'assets/ei-silence.svg':'assets/ei-sound.svg',
              alt:'',
              width:16,
              height:16,
              style:{display:'block',opacity:.92,filter:'brightness(0) invert(1)'}
            })
          ),
          toast&&h('div',{style:{
            position:'absolute',bottom:'14px',left:'50%',transform:'translateX(-50%)',
            background:'rgba(7,20,40,.92)',color:'white',padding:'8px 22px',borderRadius:'20px',
            fontSize:'13px',letterSpacing:'.07em',border:'1px solid rgba(100,200,255,.3)',
            fontFamily:"Georgia,serif",pointerEvents:'none',whiteSpace:'nowrap'
          }},`→ ${toast}`),
          isUW&&fishVisible&&h('div',{style:{
            position:'absolute',right:'14px',bottom:'16px',color:'rgba(140,210,255,.5)',
            fontSize:'11px',letterSpacing:'.08em',fontFamily:'monospace'
          }},'🐟 魚をクリックしてみて！'),
          h('div',{style:{
            position:'absolute',inset:0,background:'#071e38',
            opacity:pageFade,transition:'opacity .42s ease',pointerEvents:'none'
          }})
        );
      }

      ReactDOM.createRoot(document.getElementById('app')).render(h(App));
    </script>
  </body>
</html>
