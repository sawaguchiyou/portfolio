<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#071e38;}
</style>
</head>
<body>
<div id="app" style="width:100vw;height:100vh;background:#0a1628;overflow:hidden;position:relative;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef,useCallback,createElement:h} = React;
const W=680,H=420;
const easeInOut=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const easeOut=t=>1-Math.pow(1-t,3);

const FISH=[
  {id:1,label:"Works",   color:"#f97316",shine:"#fcd34d",size:1.3,bx:160,by:180,dir:1, spd:.38},
  {id:2,label:"About",   color:"#06b6d4",shine:"#a5f3fc",size:1.0,bx:440,by:260,dir:-1,spd:.28},
  {id:3,label:"Skills",  color:"#a855f7",shine:"#e9d5ff",size:.92,bx:280,by:330,dir:1, spd:.44},
  {id:4,label:"Contact", color:"#10b981",shine:"#6ee7b7",size:1.1,bx:520,by:150,dir:-1,spd:.33},
  {id:5,label:"Blog",    color:"#f43f5e",shine:"#fda4af",size:.85,bx:100,by:295,dir:1, spd:.42},
];

function Fish({d,t,onClick,visible}){
  const w=88*d.size,hh=36*d.size;
  const x=d.bx+Math.sin(t*d.spd+d.id)*52*d.dir;
  const y=d.by+Math.sin(t*d.spd*1.3+d.id*2)*16;
  const fx=d.dir<0?-1:1;
  return h('g',{
    style:{transform:`translate(${x}px,${y}px) scaleX(${fx})`,cursor:'pointer',
           opacity:visible?1:0,transition:'opacity .7s ease'},
    onClick:()=>onClick(d.label)
  },
    h('ellipse',{cx:0,cy:0,rx:w*.5,ry:hh*.4,fill:d.color}),
    h('polygon',{points:`${-w*.5},0 ${-w*.75},${-hh*.45} ${-w*.75},${hh*.45}`,fill:d.color}),
    h('ellipse',{cx:w*.05,cy:hh*.08,rx:w*.28,ry:hh*.18,fill:d.shine,opacity:.45}),
    h('circle',{cx:w*.3,cy:-hh*.05,r:hh*.14,fill:'white'}),
    h('circle',{cx:w*.31,cy:-hh*.05,r:hh*.07,fill:'#1a1a2e'}),
    h('polygon',{points:`${-w*.05},${-hh*.38} ${w*.15},${-hh*.38} ${w*.08},0`,fill:d.color,opacity:.75}),
    h('text',{x:0,y:hh*.68+4,textAnchor:'middle',fontSize:13*d.size,fontWeight:700,
      fontFamily:"Georgia,serif",fill:'white',style:{pointerEvents:'none'}},d.label)
  );
}

function Seaweed({x,t,ht=65,col='#065f46'}){
  const s=Math.sin(t*.8)*13;
  return h('path',{d:`M${x},420 Q${x+s},${420-ht*.45} ${x+s*.5},${420-ht}`,
    fill:'none',stroke:col,strokeWidth:5,strokeLinecap:'round'});
}

function Bubbles({t}){
  const bs=[{x:115,ph:0,r:4},{x:245,ph:1.2,r:3},{x:375,ph:2.4,r:5},{x:495,ph:.7,r:3},{x:595,ph:3.1,r:4}];
  return h('g',null,...bs.map((b,i)=>{
    const y=420-((t*28+b.ph*80)%370);
    return h('circle',{key:i,cx:b.x,cy:y,r:b.r,fill:'none',stroke:'rgba(255,255,255,.25)',strokeWidth:1});
  }));
}

function HelloCloud({y}){
  const bumps=[[50,46,18,14],[80,36,24,17],[115,32,26,19],[152,30,28,20],[190,29,28,20],
    [228,30,26,19],[265,31,26,19],[300,30,28,20],[338,31,26,19],[372,33,24,17],[400,40,20,15]];
  return h('g',{style:{transform:`translateY(${y}px)`}},
    ...bumps.map(([cx,cy,rx,ry],i)=>h('ellipse',{key:i,cx,cy,rx,ry,fill:'white'})),
    h('rect',{x:44,y:46,width:370,height:22,fill:'white',rx:8}),
    h('text',{x:220,y:62,textAnchor:'middle',fontFamily:"'Courier New',monospace",
      fontSize:22,fontWeight:700,fill:'#4a6580',letterSpacing:2},'Hello, World!')
  );
}

function Surface({t,onClickHere,showBtn,rodOut,lineY}){
  const by=Math.sin(t/3.5)*-3+Math.sin(t/1.75)*1;
  const cy=Math.sin(t/7)*-5+Math.sin(t/3.5)*-3;
  const fy=Math.sin(t/2.8)*-3+Math.sin(t/1.4)*-2;
  const wx=((t%4)/4)*68;
  const rtx=228,rty=252+by;
  const ley=rty+lineY;
  return h('g',null,
    h('rect',{x:0,y:0,width:680,height:260,fill:'#c9d8e8'}),
    h('rect',{x:0,y:0,width:680,height:100,fill:'#b8cfe0',opacity:.6}),
    h('rect',{x:0,y:160,width:680,height:100,fill:'#a8bdd4',opacity:.4}),
    h('ellipse',{cx:580,cy:220,rx:120,ry:40,fill:'#e8d5b0',opacity:.35}),
    h('circle',{cx:580,cy:218,r:22,fill:'#e8c87a',opacity:.6}),
    h('g',{fill:'#b0bec5',opacity:.55},
      h('ellipse',{cx:80,cy:80,rx:50,ry:22}),h('ellipse',{cx:45,cy:86,rx:30,ry:18}),h('ellipse',{cx:118,cy:86,rx:35,ry:18})),
    h('g',{fill:'#cfd8dc',opacity:.5},
      h('ellipse',{cx:500,cy:60,rx:44,ry:18}),h('ellipse',{cx:468,cy:66,rx:28,ry:15}),h('ellipse',{cx:535,cy:66,rx:28,ry:15})),
    h('g',{fill:'#b0bec5',opacity:.4},
      h('ellipse',{cx:420,cy:110,rx:35,ry:14}),h('ellipse',{cx:394,cy:116,rx:22,ry:11}),h('ellipse',{cx:450,cy:116,rx:22,ry:11})),
    h(HelloCloud,{y:cy}),
    showBtn&&h('g',{style:{transform:`translateY(${fy}px)`,cursor:'pointer'},onClick:onClickHere},
      h('rect',{x:270,y:200,width:140,height:32,rx:16,fill:'#2c4a6e',opacity:.85}),
      h('text',{x:340,y:221,textAnchor:'middle',fontFamily:"'Helvetica Neue',sans-serif",
        fontSize:14,fontWeight:600,fill:'white',letterSpacing:1.5},'Click here')),
    h('rect',{x:0,y:255,width:680,height:165,fill:'#2a5f8f'}),
    h('path',{d:'M0,265 Q34,257 68,265 Q102,273 136,265 Q170,257 204,265 Q238,273 272,265 Q306,257 340,265 Q374,273 408,265 Q442,257 476,265 Q510,273 544,265 Q578,257 612,265 Q646,273 680,265 L680,280 L0,280 Z',fill:'#3370a8',opacity:.9}),
    h('path',{d:'M-68,272 Q34,264 68,272 Q102,280 136,272 Q170,264 204,272 Q238,280 272,272 Q306,264 340,272 Q374,280 408,272 Q442,264 476,272 Q510,280 544,272 Q578,264 612,272 Q646,280 680,272 Q714,280 748,272 L748,285 L-68,285 Z',
      fill:'#4080bc',opacity:.5,style:{transform:`translateX(${wx}px)`}}),
    // Boat group
    h('g',{style:{transform:`translateY(${by}px)`}},
      h('g',{clipPath:'url(#aboveDeck)'},
        h('rect',{x:284,y:272,width:30,height:24,fill:'#00897b',rx:3}),
        h('rect',{x:284,y:272,width:6,height:24,fill:'#f9a825'}),
        h('rect',{x:308,y:272,width:6,height:24,fill:'#f9a825'}),
        h('rect',{x:290,y:274,width:18,height:22,fill:'#00695c'}),
        h('rect',{x:293,y:262,width:12,height:12,fill:'#e8a87c',rx:2}),
        h('ellipse',{cx:299,cy:255,rx:14,ry:13,fill:'#e8a87c'}),
        h('path',{d:'M288,260 Q299,272 310,260',fill:'#4a3020',opacity:.85}),
        h('ellipse',{cx:299,cy:264,rx:10,ry:6,fill:'#4a3020',opacity:.8}),
        h('circle',{cx:294,cy:253,r:2,fill:'#3a2010'}),
        h('circle',{cx:304,cy:253,r:2,fill:'#3a2010'}),
        h('ellipse',{cx:299,cy:245,rx:16,ry:6,fill:'#e65100'}),
        h('path',{d:'M283,245 Q299,235 315,245',fill:'#e65100'}),
        h('rect',{x:283,y:244,width:32,height:4,fill:'#bf360c',rx:1}),
        rodOut
          ?h('g',null,h('line',{x1:284,y1:278,x2:268,y2:260,stroke:'#e8a87c',strokeWidth:5,strokeLinecap:'round'}),
                      h('rect',{x:314,y:274,width:14,height:8,fill:'#e8a87c',rx:3}))
          :h('g',null,h('rect',{x:270,y:274,width:14,height:8,fill:'#e8a87c',rx:3}),
                      h('rect',{x:314,y:274,width:14,height:8,fill:'#e8a87c',rx:3}))
      ),
      h('path',{d:'M255,300 L275,342 L425,342 L445,300 Z',fill:'#7a3b10'}),
      h('path',{d:'M260,300 L278,338 L422,338 L440,300 Z',fill:'#9b4e18'}),
      h('rect',{x:255,y:294,width:190,height:10,fill:'#d4a96a',rx:2}),
      h('rect',{x:310,y:268,width:80,height:30,fill:'#f0e0c0',rx:3}),
      h('rect',{x:318,y:273,width:20,height:18,fill:'#9fc8e0',rx:1,opacity:.8}),
      h('rect',{x:362,y:273,width:20,height:18,fill:'#9fc8e0',rx:1,opacity:.8}),
      h('rect',{x:346,y:258,width:10,height:14,fill:'#7a3b10',rx:1}),
      rodOut&&h('line',{x1:268,y1:260,x2:rtx-0,y2:rty-by,stroke:'#5a3a1a',strokeWidth:3,strokeLinecap:'round'})
    ),
    rodOut&&h('g',null,
      h('path',{d:`M${rtx},${rty} Q${rtx-6},${rty+(ley-rty)*.5} ${rtx-2},${ley}`,
        fill:'none',stroke:'#ddd',strokeWidth:1.2}),
      lineY>5&&h('g',null,
        h('ellipse',{cx:rtx-2,cy:ley,rx:5,ry:4,fill:'#ef4444'}),
        h('ellipse',{cx:rtx-2,cy:ley-2,rx:4,ry:3,fill:'white'}))),
    h('g',{fill:'white',opacity:.2},
      h('ellipse',{cx:110,cy:305,rx:14,ry:2.5}),h('ellipse',{cx:195,cy:322,rx:9,ry:2}),
      h('ellipse',{cx:490,cy:308,rx:16,ry:2.5}),h('ellipse',{cx:575,cy:318,rx:11,ry:2})),
    h('path',{d:'M0,378 Q50,368 100,378 Q150,388 200,378 Q250,368 300,378 Q350,388 400,378 Q450,368 500,378 Q550,388 600,378 Q650,368 680,378 L680,420 L0,420 Z',fill:'#1a3f60'}),
    h('rect',{x:0,y:412,width:680,height:8,fill:'#b8975a'})
  );
}

function Underwater({t,fishVisible,onFish,hookY}){
  const hx=226;
  return h('g',null,
    h('rect',{x:0,y:0,width:680,height:420,fill:'#071e38'}),
    ...[120,210,330,450,570].map((x,i)=>
      h('polygon',{key:i,points:`${x-18},0 ${x+18},0 ${x+65},420 ${x-65},420`,fill:'rgba(80,180,255,.038)'})),
    h(Seaweed,{x:55,t,ht:85,col:'#065f46'}),h(Seaweed,{x:88,t,ht:52,col:'#047857'}),
    h(Seaweed,{x:575,t,ht:92,col:'#065f46'}),h(Seaweed,{x:608,t,ht:60,col:'#047857'}),
    h(Seaweed,{x:335,t,ht:48,col:'#065f46'}),
    h('path',{d:'M0,398 Q80,388 160,398 Q240,408 320,398 Q400,388 480,398 Q560,408 680,396 L680,420 L0,420 Z',fill:'#1e3a5f'}),
    h('path',{d:'M0,408 Q120,400 200,408 Q300,416 400,408 Q500,400 680,408 L680,420 L0,420 Z',fill:'#112233'}),
    h('ellipse',{cx:80,cy:412,rx:24,ry:12,fill:'#162e4a'}),
    h('ellipse',{cx:558,cy:415,rx:30,ry:10,fill:'#162e4a'}),
    h('ellipse',{cx:318,cy:418,rx:18,ry:8,fill:'#0e1f32'}),
    h(Bubbles,{t}),
    // hook line
    h('line',{x1:hx,y1:0,x2:hx,y2:hookY,stroke:'rgba(255,255,255,.35)',strokeWidth:1.2,strokeDasharray:'4 3'}),
    h('ellipse',{cx:hx,cy:hookY,rx:5,ry:4,fill:'#ef4444'}),
    h('ellipse',{cx:hx,cy:hookY-2,rx:4,ry:3,fill:'white'}),
    h('path',{d:`M${hx},${hookY+5} Q${hx+12},${hookY+16} ${hx+8},${hookY+22}`,
      fill:'none',stroke:'#94a3b8',strokeWidth:1.5,strokeLinecap:'round'}),
    ...FISH.map(d=>h(Fish,{key:d.id,d,t,onClick:onFish,visible:fishVisible})),
    h('path',{d:'M0,0 Q170,-8 340,0 Q510,8 680,0 L680,16 L0,16 Z',fill:'rgba(64,128,188,.28)'})
  );
}

function App(){
  const raf=useRef(null);
  const t0=useRef(null);
  const [time,setTime]=useState(0);
  const [phase,setPhase]=useState('surface');  // surface|casting|diving|underwater
  const [rodOut,setRodOut]=useState(false);
  const [lineY,setLineY]=useState(0);
  const [vb,setVb]=useState({x:0,y:0,w:W,h:H});
  const [fishVisible,setFishVisible]=useState(false);
  const [hookY,setHookY]=useState(30);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    const loop=ts=>{
      if(!t0.current)t0.current=ts;
      setTime((ts-t0.current)/1000);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf.current);
  },[]);

  const handleClick=useCallback(()=>{
    if(phase!=='surface')return;
    setPhase('casting');
    setRodOut(true);
    let s=null;
    const castDur=1800,lineDur=2200,lineMax=172;
    const step=ts=>{
      if(!s)s=ts;
      const lp=Math.min((ts-s)/lineDur,1);
      setLineY(easeOut(lp)*lineMax);
      if(lp<1){requestAnimationFrame(step);}
      else{setTimeout(dive,500);}
    };
    requestAnimationFrame(step);
  },[phase]);

  const dive=()=>{
    setPhase('diving');
    const sv={x:0,y:0,w:W,h:H};
    const ev={x:-15,y:218,w:W*.88,h:H*.88};
    const dur=2600;let s=null;
    const step=ts=>{
      if(!s)s=ts;
      const p=Math.min((ts-s)/dur,1),ep=easeInOut(p);
      setVb({x:sv.x+(ev.x-sv.x)*ep,y:sv.y+(ev.y-sv.y)*ep,w:sv.w+(ev.w-sv.w)*ep,h:sv.h+(ev.h-sv.h)*ep});
      if(p<1){requestAnimationFrame(step);}
      else{
        setTimeout(()=>{
          setPhase('underwater');
          setHookY(25);
          let s2=null;const hDur=1600,hTgt=115;
          const hs=ts2=>{
            if(!s2)s2=ts2;
            const hp=Math.min((ts2-s2)/hDur,1);
            setHookY(25+easeOut(hp)*(hTgt-25));
            if(hp<1)requestAnimationFrame(hs);
            else setTimeout(()=>setFishVisible(true),450);
          };
          requestAnimationFrame(hs);
        },180);
      }
    };
    requestAnimationFrame(step);
  };

  const handleFish=label=>{
    setToast(label);
    setTimeout(()=>setToast(null),2200);
  };

  const isUW=phase==='underwater';
  const vbStr=`${vb.x} ${vb.y} ${vb.w} ${vb.h}`;

  return h('div',{style:{width:'100%',height:'100%',background:'#071e38',overflow:'hidden',position:'relative'}},
    h('svg',{width:'100%',height:'100%',preserveAspectRatio:'xMidYMid slice',viewBox:vbStr,xmlns:'http://www.w3.org/2000/svg',style:{display:'block'}},
      h('defs',null,h('clipPath',{id:'aboveDeck'},h('rect',{x:255,y:0,width:190,height:304}))),
      isUW
        ?h(Underwater,{t:time,fishVisible,onFish:handleFish,hookY})
        :h(Surface,{t:time,onClickHere:handleClick,showBtn:phase==='surface',rodOut,lineY})
    ),
    toast&&h('div',{style:{
      position:'absolute',bottom:'14px',left:'50%',transform:'translateX(-50%)',
      background:'rgba(7,20,40,.92)',color:'white',padding:'8px 22px',borderRadius:'20px',
      fontSize:'13px',letterSpacing:'.07em',border:'1px solid rgba(100,200,255,.3)',
      fontFamily:"Georgia,serif",pointerEvents:'none',whiteSpace:'nowrap'
    }},`→ ${toast} へ移動中…`),
    isUW&&fishVisible&&h('div',{style:{
      position:'absolute',top:'10px',right:'14px',color:'rgba(140,210,255,.5)',
      fontSize:'11px',letterSpacing:'.08em',fontFamily:'monospace'
    }},'🐟 魚をクリックしてポートフォリオへ')
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>
</body>
</html>
