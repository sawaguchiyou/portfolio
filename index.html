<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>you_sawaguchi_portfolio</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon_3.png" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background: #0a1628;
            }

            .underwater-frame {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                border: 0;
                display: block;
            }
        </style>
    </head>
    <body>
        <iframe
            class="underwater-frame"
            id="underwaterFrame"
            src="portfolio_underwater_full.html?v=20260413-2"
            title="Portfolio Underwater Scene"
            loading="lazy"></iframe>
        <script>
            const params = new URLSearchParams(window.location.search);
            const scene = params.get("scene");
            const frame = document.getElementById("underwaterFrame");
            if (frame && scene) {
                frame.src = `portfolio_underwater_full.html?v=20260413-2&scene=${encodeURIComponent(scene)}`;
            }
        </script>
    </body>
</html>
